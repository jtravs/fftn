#
# The uv environment for FFTN's Python: the gate's tools, fbench and the codelet generator
# (AGENTS.md section 4). Not a package; nothing here is installed by users.
[project]
name = "fftn-dev"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "mpmath>=1.3",
]

[tool.uv]
package = false

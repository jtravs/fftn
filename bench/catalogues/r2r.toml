kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [12, 60, 100, 384, 1000, 3000, 10000]

[[group]]
name = "odd-rows"

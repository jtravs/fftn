kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [15, 45, 97, 243, 1001, 2187, 4093]

[[group]]
name = "client-like-rows"
note = "the row lengths of the client catalogues"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [3072, 5120, 6144, 9216, 10240, 18432, 20480, 32768, 40960]

[[group]]
name = "row-batches"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]

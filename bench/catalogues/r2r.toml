#
# The real-to-real catalogue (task 6.12, DESIGN.md 5.7; Q15 of DESIGN.md 18.2 proposes judging
# FFTN's r2r speed on it against FFTW's r2r and pocketfft): every kind, DCT-I to IV, DST-I to IV
# and the DHT (FFTW's REDFT00 ... RODFT11 and DHT; `r2r` names them by FFTN's names), on rows at
# the standard catalogue's lengths and at the row lengths of the client catalogues (the
# transverse and spectral grids of a propagation code), batches of rows, planes, volumes and the
# strided axes of the interleaved layout, in double and single precision. Each `r2r` kind applies
# to every axis of its case. Format in bench/README.md; weights are equal. Case IDs read
# r2r-KIND-dims-bBATCH-op|ip[-f32][-il-oOUTER].

[catalogue]
name = "r2r"

# ---- smoke: correctness of every kind, length class, placement, rank and layout -------------

[[group]]
name = "smoke-rows"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [2, 3, 5, 8, 15, 16, 64, 97, 1024]
batch = 2
place = ["out", "in"]
tiers = ["smoke"]

[[group]]
name = "smoke-planes"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = ["8x6", "5x7", "4x6x8"]
batch = 2
place = ["out", "in"]
tiers = ["smoke"]

[[group]]
name = "smoke-strided"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [12, "6x5"]
batch = 4
layout = "interleaved"
place = ["out", "in"]
tiers = ["smoke"]

[[group]]
name = "smoke-single"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [8, 15, 64, "8x6"]
batch = 2
precision = "f32"
tiers = ["smoke"]

# ---- rows ---------------------------------------------------------------------------------

[[group]]
name = "pow2-rows"
kind = "r2r"
r2r = ["dct1", "dct2", "dct3", "dct4", "dst1", "dst2", "dst3", "dst4", "dht"]
dims = [16, 64, 256, 1024, 4096, 16384, 65536, 262144]

[[group]]
name = "pow2-rows-quick"

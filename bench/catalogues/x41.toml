#
# Experiment X41's diagnosis of small planes (dev/experiments/X41-planes-2.md): a plane of
# ny x nx against its two phases as 1-D batches (ny rows of nx, nx rows of ny). Double
# precision.

[catalogue]
name = "x41"

[[group]]
name = "x41-planes"
kind = "c2c"
dims = ["32x32", "64x64", "16x16", "8x6"]

[[group]]
name = "x41-rows"
note = "a plane's rows (and, square planes, its columns) as one 1-D batch"
kind = "c2c"
dims = [32, 64, 16]
batch = [16, 32, 64]

[[group]]
name = "x41-rows-6-8"
kind = "c2c"
dims = [6, 8]
batch = [6, 8]

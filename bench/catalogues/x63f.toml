#
# Experiment X63's single-precision judging cases (dev/experiments/X63-c2r-planes-packed.md,
# amendment 1): out-of-place float c2r planes, x63.toml's and five larger ones (3000 x 2000,
# 2048 x 4096, 4096 x 2048, 3200^2, 4096^2) so that the EPYC's 16 MiB threshold moves enough of
# them, and two volumes, which keep the block. A float half spectrum is rows x (n/2 + 1) x 8
# bytes, half the double one; in MiB: 256^2 0.25, 36 x 2048 0.28, 2048 x 36 0.30, 384^2 0.57,
# 448^2 0.77, 512^2 1.004, 480 x 640 1.18, 640^2 1.57, 600 x 800 1.84, 720^2 1.98, 512 x 1024 and
# 1024 x 512 2.0, 768^2 2.26, 800^2 2.45, 320 x 2048 and 2048 x 320 2.5, 576 x 1152 and
# 1152 x 576 2.54, 864^2 2.85, 640 x 1280 and 1280 x 640 3.13, 960^2 3.52, 1000^2 3.82, 1024^2
# 4.01, 1200^2 5.5, 1536^2 9.0, 1600^2 9.8, 1500 x 2000 and 3000 x 1000 11.5, 2000^2 15.3,
# 2048^2, 4096 x 1024 and 1024 x 4096 16.0, 3000 x 2000 22.9, 2560^2 25.0, 2048 x 4096 and
# 4096 x 2048 32.0, 3200^2 39.1, 4096^2 64.0.

[catalogue]
name = "x63f"

[[group]]
name = "x63f-planes"
kind = "c2r"
precision = "f32"
dims = [
  "256x256", "384x384", "448x448", "512x512", "480x640", "640x640", "600x800", "720x720",
  "800x800", "512x1024", "1024x512", "576x1152", "1152x576", "320x2048", "2048x320", "640x1280",
  "1280x640", "768x768", "864x864", "960x960", "1000x1000", "1024x1024", "1200x1200",
  "1536x1536", "1600x1600", "2000x2000", "1500x2000", "3000x1000", "2048x2048", "4096x1024",
  "1024x4096", "2560x2560", "36x2048", "2048x36", "3000x2000", "2048x4096", "4096x2048",
  "3200x3200", "4096x4096",
]

[[group]]
name = "x63f-volumes"
kind = "c2r"
precision = "f32"
dims = ["64x64x64", "128x128x128"]

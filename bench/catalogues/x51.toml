#
# Experiment X51's screens of the depth-first chain's open cases
# (dev/experiments/X51-depth-2.md): rows X46 left open, single c2c rows out of place, one
# group per question. Arms force the chain's split (STRATEGY=depth, DEPTH_TOPS) against the
# rules' plan; select a group's rows with --filter.

[catalogue]
name = "x51"

[[group]]
name = "x51-double"
note = "double rows: 25000 and 100000 (Xeon), beyond 4 L2 (two tops), the EPYC's and the Mac's range"
kind = "c2c"
dims = [
  8192, 12288, 16384, 20000, 24576, 25000, 32768, 40000, 46080, 49152, 65536, 98304, 100000,
  131072, 262144, 524288, 1048576, 2097152, 4194304,
]

[[group]]
name = "x51-float"
note = "single-precision rows of the double rules' byte range and beyond"
kind = "c2c"
precision = "f32"
dims = [8192, 16384, 20000, 32768, 46080, 65536, 100000, 131072, 262144, 524288, 1048576]

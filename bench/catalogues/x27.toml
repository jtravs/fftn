#
# Experiment X27's cases (dev/experiments/X27-prime-codelets.md): lengths with a prime factor
# 17, 19 or 23 (generated codelets against Bluestein), primes whose p - 1 is smooth (Rader
# against Bluestein) and controls whose plans do not change (10403 = 101 x 103, 4093).

[catalogue]
name = "x27"

[[group]]
name = "x27-rows"
kind = "c2c"
dims = [17, 19, 23, 34, 51, 68, 289, 2431, 4913, 17408, 10403, 97, 257, 4093, 65537]
precision = ["f64", "f32"]
tiers = ["tracking"]

[[group]]
name = "x27-batches"
kind = "c2c"
dims = [17]
batch = 256
precision = ["f64", "f32"]
tiers = ["tracking"]

[[group]]
name = "x27-real"
kind = ["r2c", "c2r"]
dims = [34, 4862]
precision = ["f64", "f32"]
tiers = ["tracking"]

[[group]]
name = "x27-rader"
note = "primes (and a composite) whose largest prime has a 7-smooth p - 1: Rader against Bluestein"
kind = "c2c"
dims = [29, 31, 61, 101, 1009, 2017, 8191, 16381, 4097]
precision = ["f64", "f32"]
tiers = ["tracking"]

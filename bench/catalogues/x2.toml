#
# Experiment X2's cases (dev/experiments/X2-radix-sets.md): c2c rows, forward, out of place,
# double and single precision. Generated by bench/x2/search.py catalogue from bench/x2/
# radices.py and the standard catalogue; a test keeps them equal. Lengths with a single
# radix sequence (primes) are left out: nothing to choose.

[catalogue]
name = "x2"

[[group]]
name = "x2-smooth"
note = "every 7-smooth length up to 1024"
kind = "c2c"
dims = [
  4, 6, 8, 9, 10, 12, 14, 15, 16, 18, 20, 21, 24, 27, 28, 30, 32, 35, 36, 40, 42, 45, 48,
  50, 54, 56, 60, 63, 64, 70, 72, 75, 80, 81, 84, 90, 96, 98, 100, 105, 108, 112, 120, 126,
  128, 135, 140, 144, 147, 150, 160, 162, 168, 175, 180, 189, 192, 196, 200, 210, 216, 224,
  225, 240, 243, 245, 250, 252, 256, 270, 280, 288, 294, 300, 315, 320, 324, 336, 350, 360,
  375, 378, 384, 392, 400, 405, 420, 432, 441, 448, 450, 480, 486, 490, 500, 504, 512, 525,
  540, 560, 567, 576, 588, 600, 630, 640, 648, 672, 675, 686, 700, 720, 729, 735, 750, 756,
  768, 784, 800, 810, 840, 864, 875, 882, 896, 900, 945, 960, 972, 980, 1000, 1008, 1024,
]
batch = [1, 64]
precision = ["f64", "f32"]

[[group]]
name = "x2-long"
note = "standard catalogue rows above 1024"
kind = "c2c"
dims = [
  1200, 1440, 1536, 1920, 2000, 2048, 2187, 2400, 2431, 3000, 3125, 3600, 4096, 4097, 4800,
  5000, 6000, 6561, 7200, 8192, 10000, 10403, 12000, 15625, 16384, 20000, 25000, 32768,
  46080, 65535, 65536,
]
batch = [1, 64]
precision = ["f64", "f32"]

[[group]]
name = "x2-long-single"
note = "standard catalogue rows whose batch of 64 would exceed 4194304 points"
kind = "c2c"
dims = [
  100000, 131072, 262144, 524288, 1000000, 1048576, 2097152, 4194304, 8388608, 16777216,
]
batch = [1]
precision = ["f64", "f32"]

#
# The standard catalogue (DESIGN.md 16.1): what any FFT library is judged on. Format in
# bench/README.md. Every case is in tier "full"; a group's `tiers` adds its cases to the
# smaller tiers. A case listed by several groups is one case with the union of their tiers.
# Weights are equal here; client catalogues carry the weights of a real workload.

[catalogue]
name = "standard"

# ---- smoke: correctness of every kind, placement and rank, in seconds (the gate) ----------

[[group]]
name = "smoke-rows"
kind = "c2c"
dims = [2, 3, 5, 7, 8, 12, 16, 17, 60, 97, 128, 1024, 65536]
batch = 3
place = ["out", "in"]
tiers = ["smoke"]

[[group]]
name = "smoke-rows-backward"
kind = "c2c"
dims = [8, 15, 64]
batch = 2
direction = "bwd"
tiers = ["smoke"]

[[group]]
name = "smoke-real-rows"
kind = ["r2c", "c2r"]
dims = [2, 3, 8, 15, 16, 64, 100, 1024, 65536]
batch = 2
place = ["out", "in"]
tiers = ["smoke"]

[[group]]
name = "smoke-planes"
kind = ["c2c", "r2c", "c2r"]
dims = ["8x6", "16x16", "5x7", "32x30"]
batch = 2
place = ["out", "in"]
tiers = ["smoke"]

[[group]]
name = "smoke-single"
note = "single precision, for the backends that list f32 among their precisions"
kind = ["c2c", "r2c", "c2r"]
dims = [8, 60, 97, 1024, "16x12"]
batch = 2
place = ["out", "in"]
precision = "f32"
tiers = ["smoke"]

[[group]]
name = "smoke-volumes"
kind = ["c2c", "r2c", "c2r"]
dims = ["4x6x8", "3x5x4"]
tiers = ["smoke"]


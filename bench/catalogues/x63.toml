#
# Experiment X63's judging cases (dev/experiments/X63-c2r-planes-packed.md): out-of-place c2r
# planes, those of X60's screen and held-out check (x60.toml, x60b.toml) and sizes no run has
# timed (448^2, 576 x 1152, 1152 x 576, 320 x 2048, 2048 x 320, 1600^2, 2000^2, 1500 x 2000,
# 3000 x 1000, 4096 x 1024, 1024 x 4096, 2560^2), and two volumes, which keep the block. Half
# spectra in MiB: 256^2 0.50, 36 x 2048 0.56, 2048 x 36 0.59, 384^2 1.13, 448^2 1.54, 512^2 2.01,
# 480 x 640 2.35, 640^2 3.13, 600 x 800 3.67, 720^2 3.97, 512 x 1024 and 1024 x 512 4.0, 768^2
# 4.51, 800^2 4.90, 320 x 2048 and 2048 x 320 5.0, 576 x 1152 and 1152 x 576 5.1, 864^2 5.71,
# 640 x 1280 and 1280 x 640 6.3, 960^2 7.05, 1000^2 7.64, 1024^2 8.02, 1200^2 11.0, 1536^2 18.0,
# 1600^2 19.6, 1500 x 2000 and 3000 x 1000 22.9, 2000^2 30.6, 2048^2, 4096 x 1024 and
# 1024 x 4096 32.0, 2560^2 50.0.

[catalogue]
name = "x63"

[[group]]
name = "x63-planes"
kind = "c2r"
dims = [
  "256x256", "384x384", "448x448", "512x512", "480x640", "640x640", "600x800", "720x720",
  "800x800", "512x1024", "1024x512", "576x1152", "1152x576", "320x2048", "2048x320", "640x1280",
  "1280x640", "768x768", "864x864", "960x960", "1000x1000", "1024x1024", "1200x1200",
  "1536x1536", "1600x1600", "2000x2000", "1500x2000", "3000x1000", "2048x2048", "4096x1024",
  "1024x4096", "2560x2560", "36x2048", "2048x36",
]

[[group]]
name = "x63-volumes"
kind = "c2r"
dims = ["64x64x64", "128x128x128"]

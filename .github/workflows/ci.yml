#
# What every push and pull request runs: the gate (scripts/check.sh) on one configuration
# per platform of DESIGN.md 15.4, one ASan + UBSan job and one ThreadSanitizer job. The
# hygiene and lint stages run once, in the lint job; the code stages run in gate.yml with
# the matrices below (the reason for each entry beside it). The other compilers, the other
# platforms' sanitizers, clang-tidy and coverage run weekly and on demand (extended.yml), and
# emulated processors on main, weekly and on demand (emulation.yml).
#
# Kernel units are compiled as several translation units per instruction set (DESIGN.md
# 6.4), so instrumented builds fit the runners at full parallelism (16 GB and 4 cores on
# Linux, 7 GB and 3 cores on macOS); "jobs" limits parallel compiles where they would not.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a branch or pull request cancels the run it supersedes; every commit on
# main keeps its run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # uv for the gate's Python, and the uvx tools it pins (ruff, clang-format).
  UV_VERSION: "0.13.6"

jobs:
  # Every job runs for pushes, and for pull requests from forks only: a branch of this
  # repository already ran on its push, and the pull request shows that run's checks. The
  # jobs run in parallel; lint does not gate the builds, since latency matters more here
  # than runner minutes.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: lint (hygiene, format, Python, shell, API docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Tools (Doxygen, ShellCheck, actionlint; pinned)
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/tools
          mkdir -p "$t/bin"
          bash .github/scripts/fetch.sh \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
            14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90 "$t/doxygen.tar.gz"
          tar -xzf "$t/doxygen.tar.gz" -C "$t"
          cp "$t/doxygen-1.18.0/bin/doxygen" "$t/bin/"
          bash .github/scripts/fetch.sh \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$t/shellcheck.tar.gz"
          tar -xzf "$t/shellcheck.tar.gz" -C "$t"
          cp "$t/shellcheck-v0.11.0/shellcheck" "$t/bin/"
          bash .github/scripts/fetch.sh \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$t/actionlint.tar.gz"
          tar -xzf "$t/actionlint.tar.gz" -C "$t/bin" actionlint
          echo "$t/bin" >> "$GITHUB_PATH"
      - name: actionlint (workflows)
        run: actionlint -color=false
      - name: Gate, lint stages
        env:
          FFTN_CHECK_STAGES: spdx docs knobs format python shell gen apidoc
        run: bash scripts/check.sh

  gate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    uses: ./.github/workflows/gate.yml
    with:
      # Linux x86-64. Clang 23 is the development compiler; Clang 16 is the Clang floor
      # (AGENTS.md section 4), preinstalled on the image. The one ASan + UBSan job and the
      # one ThreadSanitizer job are here: Clang's TSan job is the quicker (14 minutes against
      # GCC's 18-26 before the kernel units were split), and both find what the code does
      # wrong on every platform. GCC's sanitizers (B1 found GCC-only failure modes) run in
      # extended.yml.
      linux: >-
        [
          {"name": "clang-23", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "build bench"},
          {"name": "clang-23 asan", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "sanitize"},
          {"name": "clang-23 tsan", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "tsan"},
          {"name": "clang-16", "cxx": "/usr/lib/llvm-16/bin/clang++", "stages": "build"}
        ]
      # The current GCC, from its official image.
      linux-gcc-current: >-
        [
          {"name": "gcc-16", "stages": "build"}
        ]
      # AArch64 with GCC 14, the GCC floor: the getauxval feature path (Neoverse N2 runners,
      # FCMA and pointer authentication, so neon and neon_fcma are forced beside scalar).
      linux-arm64: >-
        [
          {"name": "gcc-14", "cxx": "g++-14", "stages": "build bench"}
        ]
      # Homebrew LLVM, the maintainer's configuration, and its ASan + UBSan with leak
      # detection (which Apple Clang's lacks): the only sanitizer run of NEON with FCMA
      # (Apple silicon) and of the macOS runtime. Two compiles at a time in 7 GB.
      macos: >-
        [
          {"name": "llvm", "brew-llvm": true, "stages": "build bench"},
          {"name": "llvm asan", "brew-llvm": true, "stages": "sanitize", "jobs": 2}
        ]
      # Clang on the MSVC ABI with clang-cl, x64 and Arm64 (experiment B2), with LLVM as
      # installed on the image. The C compiler (GoogleTest's project() enables C) is named
      # too: left to itself, CMake finds the GNU-driver clang.exe beside clang-cl and hands
      # it MSVC-style flags, which it rejects.
      windows: >-
        [
          {"name": "x64 clang-cl", "runner": "windows-2025", "arch": "x64", "stages": "build",
           "cc": "C:/Program Files/LLVM/bin/clang-cl.exe",
           "cxx": "C:/Program Files/LLVM/bin/clang-cl.exe"},
          {"name": "arm64 clang-cl", "runner": "windows-11-arm", "arch": "arm64",
           "stages": "build",
           "cc": "C:/Program Files/LLVM/bin/clang-cl.exe",
           "cxx": "C:/Program Files/LLVM/bin/clang-cl.exe"}
        ]

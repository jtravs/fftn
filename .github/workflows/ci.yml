#
# The per-change checks. Pull requests run a short set, the checks the repository's ruleset
# requires before a merge (lint, GCC 16 and Clang 23 ASan + UBSan on Linux x86-64, Homebrew
# LLVM on macOS arm64), so that a merge waits about 20 minutes. Each push to main then runs
# the full set: those plus ThreadSanitizer, the Clang floor, Clang without the old x86
# targets, AArch64 and Windows (the post-merge jobs), so that a break, including one that
# only two merged pull requests make together, shows within the hour and is fixed on main
# (maintainer, 2026-11-17: no users yet, latency matters more than a green main at every
# commit). The hygiene and lint stages run once, in the lint job; the code stages run in
# gate.yml with the matrices below (the reason for each entry beside it). The other
# compilers, the other platforms' sanitizers, clang-tidy and coverage run weekly and on
# demand (extended.yml), and emulated processors weekly and on demand (emulation.yml).
#
# Kernel units are compiled as several translation units per instruction set (DESIGN.md
# 6.4), so instrumented builds fit the runners at full parallelism (16 GB and 4 cores on
# Linux, 7 GB and 3 cores on macOS); "jobs" limits parallel compiles where they would not.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Runs on main are not
# cancelled, since main's run is the only one of the full set: one runs at a time and a
# newer push replaces only a run still waiting, so each finished run covers every merge
# before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv for the gate's Python, and the uvx tools it pins (ruff, clang-format).
  UV_VERSION: "0.13.6"

jobs:
  # Pull requests run on their merge with main (lint and gate: the checks the ruleset
  # requires); pushes run on main only (lint, gate and post-merge). The jobs run in parallel;
  # lint does not gate the builds, since latency matters more here than runner minutes.
  lint:
    name: lint (hygiene, format, Python, shell, API docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Tools (Doxygen, ShellCheck, actionlint; pinned)
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/tools
          mkdir -p "$t/bin"
          bash .github/scripts/fetch.sh \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
            14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90 "$t/doxygen.tar.gz"
          tar -xzf "$t/doxygen.tar.gz" -C "$t"
          cp "$t/doxygen-1.18.0/bin/doxygen" "$t/bin/"
          bash .github/scripts/fetch.sh \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$t/shellcheck.tar.gz"
          tar -xzf "$t/shellcheck.tar.gz" -C "$t"
          cp "$t/shellcheck-v0.11.0/shellcheck" "$t/bin/"
          bash .github/scripts/fetch.sh \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$t/actionlint.tar.gz"
          tar -xzf "$t/actionlint.tar.gz" -C "$t/bin" actionlint
          echo "$t/bin" >> "$GITHUB_PATH"
      - name: actionlint (workflows)
        run: actionlint -color=false
      - name: Gate, lint stages
        env:
          FFTN_CHECK_STAGES: spdx docs knobs format python shell gen apidoc
        run: bash scripts/check.sh

  # The checks the ruleset requires: one x86-64 build with GCC (the current release, which
  # also tests the old x86 targets), one sanitizer job, and the maintainer's configuration on
  # Arm.
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      # The sanitizer job takes about 15 minutes with a current ccache (12 of them tests, since
      # the quadruple-precision reference remembers its results, PR 89; 25-27 before). Its
      # 70-90-minute runs of 2026-11-18/19 were a rebuild of the kernel units under ASan from a
      # stale ccache (41-66 minutes, now rarer: main saves its ccache whatever the result) and
      # a stalled apt-get (now cut off and retried); 90 leaves room for such a rebuild.
      timeout: 90
      # Clang 23 is the development compiler. Its ASan + UBSan job finds what the code does
      # wrong on every platform; it leaves out the old x86 targets (x86_v2, avx), with which
      # every kernel test runs twice more and the job passed its 90-minute timeout against
      # 21 minutes without. GCC's sanitizers (B1 found GCC-only failure modes) run in
      # extended.yml, with the old targets.
      linux: >-
        [
          {"name": "clang-23 asan", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "sanitize", "old_x86": "OFF"}
        ]
      # The current GCC, from its official image, with the benchmark smoke; the Kokkos
      # adapter's tests on the OpenMP back end (libgomp) here, on Threads elsewhere; the C API's
      # shared library (FFTN_BUILD_C_SHARED) and its tests here only.
      linux-gcc-current: >-
        [
          {"name": "gcc-16", "stages": "build bench", "kokkos": "OpenMP", "c_shared": "ON"}
        ]
      # Homebrew LLVM, the maintainer's configuration. Its ASan + UBSan (the only sanitizer
      # run of NEON with FCMA) took 61 minutes on these runners, the slowest job by far, and
      # runs weekly in extended.yml; AArch64 sanitizers come from Linux in extended.yml.
      macos: >-
        [
          {"name": "llvm", "brew-llvm": true, "stages": "build bench"}
        ]

  # The rest of the per-change set, on pushes to main (and on demand), not on pull requests.
  post-merge:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/gate.yml
    with:
      # Linux x86-64: Clang 23 with the benchmark smoke; its ThreadSanitizer job (the quicker
      # of Clang's and GCC's, without the old x86 targets for the reason above); Clang 16, the
      # Clang floor (AGENTS.md section 4), preinstalled on the image; and a build without the
      # old x86 targets (FFTN_OLD_X86_TARGETS=OFF).
      linux: >-
        [
          {"name": "clang-23", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "build bench"},
          {"name": "clang-23 tsan", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "tsan", "old_x86": "OFF"},
          {"name": "clang-16", "cxx": "/usr/lib/llvm-16/bin/clang++", "stages": "build"},
          {"name": "clang-23 no old x86", "llvm": "23", "cxx": "/usr/lib/llvm-23/bin/clang++",
           "stages": "build", "old_x86": "OFF"}
        ]
      # AArch64 with GCC 14, the GCC floor: the getauxval feature path (Neoverse N2 runners,
      # FCMA and pointer authentication, so neon and neon_fcma are forced beside scalar).
      linux-arm64: >-
        [
          {"name": "gcc-14", "cxx": "g++-14", "stages": "build bench"}
        ]
      # Clang on the MSVC ABI with clang-cl, x64 and Arm64 (experiment B2), with the pinned
      # LLVM that gate.yml installs in C:/fftn-llvm (.github/scripts/install-llvm-windows.sh).
      # The C compiler (GoogleTest's project() enables C) is named too: left to itself, CMake
      # finds the GNU-driver clang.exe beside clang-cl and hands it MSVC-style flags, which
      # it rejects.
      windows: >-
        [
          {"name": "x64 clang-cl", "runner": "windows-2025", "arch": "x64", "stages": "build",
           "cc": "C:/fftn-llvm/bin/clang-cl.exe",
           "cxx": "C:/fftn-llvm/bin/clang-cl.exe"},
          {"name": "arm64 clang-cl", "runner": "windows-11-arm", "arch": "arm64",
           "stages": "build",
           "cc": "C:/fftn-llvm/bin/clang-cl.exe",
           "cxx": "C:/fftn-llvm/bin/clang-cl.exe"}
        ]

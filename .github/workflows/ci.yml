# SPDX-License-Identifier: Apache-2.0
#
# The gate (scripts/check.sh) on every platform of DESIGN.md 15.4. Hygiene and lint stages
# run once, in the lint job; every other job runs the code stages chosen for its compiler
# ("stages" in each matrix entry, with the reason beside it). Sanitizers run on GCC and
# Clang, Linux and macOS, x86-64 and AArch64; clang-tidy on Linux x86-64, Linux AArch64
# and macOS, since its findings follow the platform's #if branches; coverage with Clang on
# Linux x86-64 and macOS. Windows builds and tests only (no sanitizer or coverage stage is
# set up for the MSVC ABI). Emulated processors are in emulation.yml.
#
# Pins: actions by commit; the uv version below; tools by URL and SHA-256
# (.github/scripts/fetch.sh); the current-GCC image by digest; LLVM 23 from apt.llvm.org
# with its signing key pinned (.github/scripts/install-llvm.sh). Compilers that come with
# the runner images (GCC 14, Clang 16, Apple Clang, Homebrew LLVM, LLVM on Windows) are
# reported by the gate in every log.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv for the gate's Python, and the uvx tools it pins (clang-format, clang-tidy, ruff).
  UV_VERSION: "0.13.6"

jobs:
  # Every job runs for pushes, and for pull requests from forks only: a branch of this
  # repository already ran on its push. The jobs run in parallel; lint does not gate the
  # builds, since latency matters more here than runner minutes.
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: lint (hygiene, format, Python, shell, API docs)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Tools (Doxygen, ShellCheck, actionlint; pinned)
        run: |
          set -euo pipefail
          t=$RUNNER_TEMP/tools
          mkdir -p "$t/bin"
          bash .github/scripts/fetch.sh \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz \
            14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90 "$t/doxygen.tar.gz"
          tar -xzf "$t/doxygen.tar.gz" -C "$t"
          cp "$t/doxygen-1.18.0/bin/doxygen" "$t/bin/"
          bash .github/scripts/fetch.sh \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
            b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6 "$t/shellcheck.tar.gz"
          tar -xzf "$t/shellcheck.tar.gz" -C "$t"
          cp "$t/shellcheck-v0.11.0/shellcheck" "$t/bin/"
          bash .github/scripts/fetch.sh \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$t/actionlint.tar.gz"
          tar -xzf "$t/actionlint.tar.gz" -C "$t/bin" actionlint
          echo "$t/bin" >> "$GITHUB_PATH"
      - name: actionlint (workflows)
        run: actionlint -color=false
      - name: Gate, lint stages
        env:
          FFTN_CHECK_STAGES: spdx docs knobs format python shell gen apidoc
        run: bash scripts/check.sh

  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: linux x86-64 ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The floor (AGENTS.md section 4), with both sanitizer stages: B1 found GCC-only
          # failure modes, and GCC 14's TSan is the one that needs the address-space fix.
          - name: gcc-14
            cxx: g++-14
            stages: build sanitize tsan bench
          # The development compiler: every code stage, including tidy and coverage.
          - name: clang-23
            llvm: "23"
            cxx: /usr/lib/llvm-23/bin/clang++
            stages: build tidy sanitize tsan coverage bench
          # The Clang floor: compiles cleanly and passes; preinstalled on the image.
          - name: clang-16
            cxx: /usr/lib/llvm-16/bin/clang++
            stages: build
    env:
      CXX: ${{ matrix.cxx }}
      FFTN_CHECK_STAGES: ${{ matrix.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: LLVM ${{ matrix.llvm }}
        if: matrix.llvm
        run: bash .github/scripts/install-llvm.sh "${{ matrix.llvm }}"
      - name: Address-space randomisation that every sanitizer runtime supports
        # The image's kernel uses 32 bits of mmap randomisation, which older ASan and TSan
        # runtimes cannot map around; 28 bits is the long-standing default.
        run: sudo sysctl -w vm.mmap_rnd_bits=28
      - &fetchcontent-restore
        name: FetchContent archives (restore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fftn-fetchcontent
          key: fetchcontent-${{ hashFiles('cmake/*.cmake') }}
      - &fetchcontent-place
        name: FetchContent archives (place)
        shell: bash
        run: bash .github/scripts/fetchcontent-cache.sh restore ~/.cache/fftn-fetchcontent
      - name: Gate, ${{ matrix.stages }}
        run: bash scripts/check.sh
      - &detected
        name: What FFTN detects here
        if: always()
        shell: bash
        run: |
          for d in build/check-release build/check-sanitize; do
            for exe in "$d/tests/platform/fftn_platform_dump" "$d/tests/platform/fftn_platform_dump.exe"; do
              if [[ -x $exe ]]; then "$exe"; exit 0; fi
            done
          done
          echo "no fftn_platform_dump was built"
      - &fetchcontent-collect
        name: FetchContent archives (collect)
        if: always()
        shell: bash
        run: bash .github/scripts/fetchcontent-cache.sh save ~/.cache/fftn-fetchcontent
      - &logs
        name: Build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ github.job }}-${{ strategy.job-index }}
          path: |
            build/*.log
            build/*/Testing/Temporary/LastTest*.log
          if-no-files-found: ignore
          retention-days: 14

  linux-gcc-current:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: linux x86-64 gcc-16
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    # The current GCC from its official image, pinned by digest. seccomp is relaxed so that
    # the gate can run TSan's tests with address randomisation off (setarch -R), which
    # Docker's default profile forbids.
    container:
      image: gcc:16.2.0-trixie@sha256:b8a42d6804296fbe7a54e17e9d60c3100d9e8dbe7ef88c748cae2ddb00d63ba2
      options: --security-opt seccomp=unconfined
    env:
      CXX: g++
      FFTN_CHECK_STAGES: build sanitize tsan
    steps:
      - name: Packages (CMake, Ninja)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - *fetchcontent-restore
      - *fetchcontent-place
      - name: Gate, build sanitize tsan
        run: bash scripts/check.sh
      - *detected
      - *fetchcontent-collect
      - *logs

  linux-arm64:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: linux aarch64 ${{ matrix.name }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # The getauxval feature path runs here for the first time (Neoverse N2 runners:
          # FCMA and pointer authentication, so neon_fcma is forced alongside scalar).
          - name: gcc-14
            cxx: g++-14
            stages: build sanitize bench
          - name: clang-23
            llvm: "23"
            cxx: /usr/lib/llvm-23/bin/clang++
            stages: build tidy tsan
    env:
      CXX: ${{ matrix.cxx }}
      FFTN_CHECK_STAGES: ${{ matrix.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Ninja
        run: command -v ninja || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build; }
      - name: LLVM ${{ matrix.llvm }}
        if: matrix.llvm
        run: bash .github/scripts/install-llvm.sh "${{ matrix.llvm }}"
      - name: Address-space randomisation that every sanitizer runtime supports
        run: sudo sysctl -w vm.mmap_rnd_bits=28 || true
      - *fetchcontent-restore
      - *fetchcontent-place
      - name: Gate, ${{ matrix.stages }}
        run: bash scripts/check.sh
      - *detected
      - *fetchcontent-collect
      - *logs

  macos:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: macos arm64 ${{ matrix.name }}
    runs-on: macos-26
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple's compiler: leak detection is not available in its ASan (the gate says so).
          - name: apple-clang
            cxx: clang++
            stages: build sanitize bench
          # Homebrew LLVM, the maintainer's configuration, split in two jobs to keep each
          # under half an hour on the three-core runners.
          - name: llvm
            brew-llvm: true
            stages: build tidy coverage
          - name: llvm-sanitizers
            brew-llvm: true
            stages: sanitize tsan
    env:
      FFTN_CHECK_STAGES: ${{ matrix.stages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Compiler and Ninja
        env:
          BREW_LLVM: ${{ matrix.brew-llvm }}
          APPLE_CXX: ${{ matrix.cxx }}
        run: |
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1
          command -v ninja || brew install ninja
          if [[ $BREW_LLVM == true ]]; then
            brew install llvm
            echo "CXX=$(brew --prefix llvm)/bin/clang++" >> "$GITHUB_ENV"
          else
            echo "CXX=$APPLE_CXX" >> "$GITHUB_ENV"
          fi
      - *fetchcontent-restore
      - *fetchcontent-place
      - name: Gate, ${{ matrix.stages }}
        run: bash scripts/check.sh
      - *detected
      - *fetchcontent-collect
      - *logs

  windows:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    name: windows ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Clang on the MSVC ABI, both drivers (DESIGN.md 14.3), with LLVM as installed on
          # the image. These jobs are experiment B2's runs. The C compiler (GoogleTest's
          # project() enables C) is named too: left to itself, CMake finds the GNU-driver
          # clang.exe beside clang-cl and hands it MSVC-style flags, which it rejects.
          - name: x64 clang-cl
            runner: windows-2025
            arch: x64
            cc: C:/Program Files/LLVM/bin/clang-cl.exe
            cxx: C:/Program Files/LLVM/bin/clang-cl.exe
          - name: x64 clang++
            runner: windows-2025
            arch: x64
            cc: C:/Program Files/LLVM/bin/clang.exe
            cxx: C:/Program Files/LLVM/bin/clang++.exe
          - name: arm64 clang-cl
            runner: windows-11-arm
            arch: arm64
            cc: C:/Program Files/LLVM/bin/clang-cl.exe
            cxx: C:/Program Files/LLVM/bin/clang-cl.exe
    defaults:
      run:
        shell: bash
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      FFTN_CHECK_STAGES: build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Visual Studio environment (${{ matrix.arch }})
        shell: pwsh
        run: .github/scripts/msvc-env.ps1 ${{ matrix.arch }}
      - name: Toolchain
        run: |
          "$CXX" --version
          cmake --version | head -1
          ninja --version
          echo "FFTN_CHECK_JOBS=$NUMBER_OF_PROCESSORS" >> "$GITHUB_ENV"
      - *fetchcontent-restore
      - *fetchcontent-place
      - name: Gate, build
        run: bash scripts/check.sh
      - *detected
      - name: Windows on Arm feature probe (B2)
        if: always() && matrix.arch == 'arm64'
        run: |
          echo "PF_ARM_* flags that the SDK defines ($WindowsSDKVersion):"
          winnt="$(cygpath "$WindowsSdkDir")/Include/${WindowsSDKVersion%\\}/um/winnt.h"
          grep -E '#define PF_ARM_' "$winnt" || echo "none found in $winnt"
          # Options with '-', not '/': Git Bash would rewrite '/x' as a path.
          mkdir -p build
          "$CXX" -nologo -std:c++20 -EHsc -O1 .github/b2/woa_features.cpp \
            -Fe:build/woa_features.exe -link advapi32.lib
          build/woa_features.exe
      - *fetchcontent-collect
      - *logs

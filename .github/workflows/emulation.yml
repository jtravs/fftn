#
# The test programs on emulated processors (DESIGN.md 15.4): instruction sets and old
# machines the runners lack. Each job builds the check-release preset natively once, then
# .github/scripts/emulate.sh runs every test program on each processor model, after checking
# what fftn_platform_dump reports there (the features and the target a plan would choose).
# A model's "expect" lists those lines, the best_target among them. The models whose target
# exists only for old processors (Nehalem: x86_v2, Sandy Bridge: avx; task 1.3) run every
# test program there, the oracle suites included ("full"), since no runner can run those
# targets as the best one; the others run the instruction-set test programs.
name: emulation

# Emulation checks instruction-set safety, which changes only when kernels or detection do:
# it runs on main, weekly, and on demand, not on every branch push (maintainer, 2026-11-13).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.13.6"
  # Intel SDE (Intel Simplified Software License; downloaded at run time, never committed).
  SDE_URL: https://downloadmirror.intel.com/924984/sde-external-10.13.1-2026-07-28-lin.tar.xz
  SDE_SHA256: 94e97d623fec54385686e1e7ba65ebc9941748c05ee451423948334892bf2b50
  # QEMU 11.1.3 user mode, statically linked: Debian's qemu-user package for arm64.
  QEMU_URL: https://snapshot.debian.org/archive/debian/20261029T211301Z/pool/main/q/qemu/qemu-user_11.1.3%2Bds-1_arm64.deb
  QEMU_SHA256: 65580ec3be90fbb51e66c10e06b816759e313271896780af780b0720956cf1e5

jobs:
  sde:
    # One job per processor model: the full suites on Nehalem and Sandy Bridge take longer
    # than one job's limit for all four models together. Haswell and Skylake-SP leave out
    # x86_v2 and avx ("skip", FFTN_TEST_SKIP_ISAS): under SDE x86_v2's legacy-SSE code ran so
    # slowly there that fftn_core_tests took 61 minutes on Haswell and passed 106 on
    # Skylake-SP (run 44008536496), and the Nehalem and Sandy Bridge jobs run both targets.
    name: x86-64 under Intel SDE (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.full && 180 || 120 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The chip check is limited to the test programs themselves
          # (-chip_check_exe_only): FFTN is linked into them statically, and the C and C++
          # runtimes are the system's business.
          - model: Nehalem (x86-64-v2 class; target x86_v2)
            sde: -nhm
            expect: "sse42 1;popcnt 1;avx 0;avx2 0;fma 0;best_target x86_v2"
            full: true
            skip: ""
          - model: Sandy Bridge (AVX without AVX2 or FMA; target avx)
            sde: -snb
            expect: "sse42 1;avx 1;avx2 0;fma 0;avx512f 0;best_target avx"
            full: true
            skip: ""
          - model: Haswell (AVX2 and FMA; target avx2)
            sde: -hsw
            expect: "avx 1;avx2 1;fma 1;avx512f 0;best_target avx2"
            full: false
            skip: x86_v2,avx
          - model: Skylake-SP (AVX-512 F, DQ, BW, VL; target avx512)
            sde: -skx
            expect: "avx2 1;avx512f 1;avx512dq 1;avx512bw 1;avx512vl 1;best_target avx512"
            full: false
            skip: x86_v2,avx
          # No model here has AVX-512 F without DQ and VL: SDE 10 dropped Knights Landing (its
          # -knl option is rejected as a bad option). The avx512 target's DQ and VL gates are
          # tested on synthetic feature sets instead (tests/isa/target_test.cpp,
          # runs_on_needs_every_feature_the_attribute_enables).
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            scripts/check.sh
          prune-cache: false
          cache-python: true
      - name: Intel SDE (pinned)
        run: |
          bash .github/scripts/fetch.sh "$SDE_URL" "$SDE_SHA256" "$RUNNER_TEMP/sde.tar.xz"
          mkdir -p "$RUNNER_TEMP/sde"
          tar -xJf "$RUNNER_TEMP/sde.tar.xz" -C "$RUNNER_TEMP/sde" --strip-components=1
          echo "SDE=$RUNNER_TEMP/sde/sde64" >> "$GITHUB_ENV"
      - &fetchcontent-restore
        name: FetchContent archives (restore)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/fftn-fetchcontent
          key: fetchcontent-${{ hashFiles('cmake/*.cmake') }}
      - &fetchcontent-place
        name: FetchContent archives (place)
        run: bash .github/scripts/fetchcontent-cache.sh restore ~/.cache/fftn-fetchcontent
      - &build
        name: Build (check-release)
        run: |
          cmake --preset check-release
          cmake --build --preset check-release
      - name: What the runner reports natively
        run: build/check-release/tests/platform/fftn_platform_dump
      - name: ${{ matrix.model }}
        env:
          EXPECT: ${{ matrix.expect }}
          SDE_MODEL: ${{ matrix.sde }}
          EMULATE_FULL: ${{ matrix.full && '1' || '0' }}
          FFTN_TEST_SKIP_ISAS: ${{ matrix.skip }}
        run: >
          bash .github/scripts/emulate.sh build/check-release "$EXPECT"
          "$SDE" "$SDE_MODEL" -chip_check_exe_only --
      - &fetchcontent-collect
        name: FetchContent archives (collect)
        if: always()
        run: bash .github/scripts/fetchcontent-cache.sh save ~/.cache/fftn-fetchcontent

  qemu:
    # One job per emulated processor: run one after another the five took over the 60-minute
    # limit once the walking skeleton's oracle suites and the Kokkos tests arrived.
    name: aarch64 under QEMU (${{ matrix.model }})
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: Cortex-A72 (Armv8.0; target neon)
            cpu: cortex-a72
            expect: "neon 1;fcma 0;pauth 0;best_target neon"
          - model: Neoverse N1 (Armv8.2, no FCMA; target neon)
            cpu: neoverse-n1
            expect: "neon 1;fcma 0;pauth 0;best_target neon"
          # FCMA without pointer authentication: neon_fcma must not be chosen (DESIGN.md 6.4).
          - model: A64FX (FCMA, no pointer authentication; target neon)
            cpu: a64fx
            expect: "neon 1;fcma 1;pauth 0;best_target neon"
          - model: QEMU max without pointer authentication (target neon)
            cpu: max,pauth=off
            expect: "neon 1;fcma 1;pauth 0;best_target neon"
          - model: Neoverse V1 (FCMA and pointer authentication; target neon_fcma)
            cpu: neoverse-v1
            expect: "neon 1;fcma 1;pauth 1;best_target neon_fcma"
    env:
      CXX: g++-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - *uv
      - name: Ninja
        run: command -v ninja || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ninja-build; }
      - name: QEMU user mode (pinned)
        run: |
          bash .github/scripts/fetch.sh "$QEMU_URL" "$QEMU_SHA256" "$RUNNER_TEMP/qemu-user.deb"
          mkdir -p "$RUNNER_TEMP/qemu"
          dpkg-deb -x "$RUNNER_TEMP/qemu-user.deb" "$RUNNER_TEMP/qemu"
          echo "QEMU=$RUNNER_TEMP/qemu/usr/bin/qemu-aarch64" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/qemu/usr/bin/qemu-aarch64" -version
      - *fetchcontent-restore
      - *fetchcontent-place
      - *build
      - name: What the runner reports natively
        run: build/check-release/tests/platform/fftn_platform_dump
      - name: ${{ matrix.model }}
        env:
          EXPECT: ${{ matrix.expect }}
          CPU: ${{ matrix.cpu }}
        run: bash .github/scripts/emulate.sh build/check-release "$EXPECT" "$QEMU" -cpu "$CPU"
      - *fetchcontent-collect

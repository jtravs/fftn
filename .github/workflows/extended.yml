#
# The rest of the gate's matrix (DESIGN.md 15.4), weekly and on demand (Actions, "extended",
# Run workflow, on any branch): the second GCC version, Apple Clang, clang++ on Windows,
# every sanitizer that ci.yml does not run, clang-tidy and coverage. Their findings are
# fixed in batches (AGENTS.md section 3); ci.yml keeps one configuration per platform and
# one job per sanitizer on each push to main. The matrices are read by gate.yml.
name: extended

on:
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    uses: ./.github/workflows/gate.yml
    with:
      timeout: 240
      windows: >-
        [
          {"name": "x64 clang++", "runner": "windows-2025", "arch": "x64", "stages": "build",
           "cc": "C:/fftn-llvm/bin/clang.exe",
           "cxx": "C:/fftn-llvm/bin/clang++.exe"},
          {"name": "x64 clang-cl", "runner": "windows-2025", "arch": "x64", "stages": "build",
           "cc": "C:/fftn-llvm/bin/clang-cl.exe",
           "cxx": "C:/fftn-llvm/bin/clang-cl.exe"},
          {"name": "arm64 clang-cl", "runner": "windows-11-arm", "arch": "arm64",
           "stages": "build",
           "cc": "C:/fftn-llvm/bin/clang-cl.exe",
           "cxx": "C:/fftn-llvm/bin/clang-cl.exe"}
        ]

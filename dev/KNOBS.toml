#
# Registry of experimental switches (FFTN_X_*). Every switch in the code must be listed
# here with an owner, the experiment it serves and an expiry date at most 30 days ahead.
# The gate (tools/repo_lint.py knobs) fails on unregistered, expired or unused entries.
#
# [FFTN_X_EXAMPLE]
# owner = "name"
# experiment = "X1"
# expires = "2026-12-01"

# Campaign branch exp/cloud-x69 only (never merged): the fbench option FIT_IN_PLACE_BYTES of
# experiment X69's cloud run (bench/backends/fftn_tuning.hpp). Not a library switch; registered
# so that it expires.
[FFTN_X_X69]
owner = "lead"
experiment = "X69"
expires = "2026-12-24"

#
# Registry of experimental switches (FFTN_X_*). Every switch in the code must be listed
# here with an owner, the experiment it serves and an expiry date at most 30 days ahead.
# The gate (tools/repo_lint.py knobs) fails on unregistered, expired or unused entries.
#
# [FFTN_X_EXAMPLE]
# owner = "name"
# experiment = "X1"
# expires = "2026-12-01"

# Experiment X15 (dev/experiments/X15-compiler-vectorised-scalar.md); CMake options in
# cmake/FftnExperiments.cmake, all OFF by default.

[FFTN_X_OMP_SIMD]
owner = "lead"
experiment = "X15"
expires = "2026-12-13"

[FFTN_X_AVX2_SCALAR_TEXT]
owner = "lead"
experiment = "X15"
expires = "2026-12-13"

[FFTN_X_NATIVE]
owner = "lead"
experiment = "X15"
expires = "2026-12-13"
